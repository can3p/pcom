# sql-migrate config. sql-migrate expands environment variables in datasource.
# Run it through sqlmigrate.sh (make migrate, make migrate-prod), which
# checks that DATABASE_URL is set.
development:
  dialect: postgres
  datasource: ${DATABASE_URL}
  dir: migrations
  table: migrations

production:
  dialect: postgres
  datasource: ${DATABASE_URL}
  dir: migrations
  table: migrations
