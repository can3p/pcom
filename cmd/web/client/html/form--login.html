<form method="POST"
      action="{{ link "form_login" }}"
      hx-post="{{ link "form_login" }}"
      hx-swap="outerHTML"
      hx-disabled-elt="this"
  >

  <input type="hidden" name="return_url" value="{{ .ReturnURL }}" />
  <input type="hidden" name="sign" value="{{ .Sign }}" />

  <div class="field">
    <label for="loginEmail">Email address</label>
    <input name="email" type="email"
                        value="{{ if .Input }}{{ .Input.Email }}{{ end }}"
                        {{ if (.Errors.HasError "email") }}aria-invalid="true" aria-describedby="loginEmailError"{{ end }}
                        id="loginEmail"
                        required>
    {{ if (.Errors.HasError "email") }}
    <p class="field-error" id="loginEmailError" data-testid="field-error-email">{{ .Errors.email }}</p>
    {{ end }}
  </div>

  <div class="auth-submit">
    <button type="submit" class="btn btn-primary">Email me a code</button>
    {{ with .FormError }}<span class="status err" role="alert" data-testid="form-error">{{ . }}</span>{{ end }}
  </div>

  {{ if not .HideSignupLink }}
  <p class="field-help auth-links">Don't have account? <a href="{{ link "signup" }}">Signup!</a></p>
  {{ end }}
</form>
