<form class="settings-form"
      method="POST"
      action="{{ link "form_user_styles" }}"
      hx-post="{{ link "form_user_styles" }}"
      hx-swap="outerHTML"
      hx-disabled-elt="this"
      >

  <div class="field">
    <label for="settingsStyles">CSS</label>
    <textarea name="styles"
              class="settings-code"
              id="settingsStyles"
              rows="8"
              spellcheck="false"
              aria-describedby="settingsStylesHelp{{ if (.Errors.HasError "styles") }} settingsStylesError{{ end }}"
              {{ if (.Errors.HasError "styles") }}aria-invalid="true"{{ end }}
              >{{ if .Input }}{{ .Input.Styles }}{{ end }}</textarea>
    {{ if (.Errors.HasError "styles") }}
    <p class="field-error" id="settingsStylesError">{{ .Errors.styles }}</p>
    {{ end }}
    <p class="field-help settings-hooks" id="settingsStylesHelp">Stable hooks: <code>.us-feed-post</code><code>.us-post-header</code><code>.us-post-body</code><code>.us-single-comment</code><code>.us-comments-section</code></p>
  </div>

  <div class="settings-row">
    <button type="submit" class="btn btn-primary">Save</button>
    {{ template "partial--settings_status.html" . }}
  </div>
</form>
