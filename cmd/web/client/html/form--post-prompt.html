<form method="POST"
  class="prompt-form"
  action="{{ link "form_prompt_post" }}"
  hx-post="{{ link "form_prompt_post" }}"
  hx-swap="outerHTML"
  hx-disabled-elt="this"
  >
  <div class="field">
    <label class="sr-only" for="prompt-message">Ask for a post</label>
    <input type="text" id="prompt-message" placeholder="Ask for a post: What's up?" name="message" value="{{ if .Input }}{{ .Input.Message }}{{ end }}" required>
  </div>
  <div class="field">
    <label class="sr-only" for="prompt-recipient">Who to ask</label>
    <input type="text" id="prompt-recipient" placeholder="%username%" list="connection_user_handles" value="{{ if .Input }}{{ .Input.RecipientHandle }}{{ end }}" name="recipient_handle" autocomplete="on" required>
    <datalist id="connection_user_handles">
      {{ range .DirectConnections }}
      <option value="{{ .Username }}">{{ .Username }}</option>
      {{ end }}
    </datalist>
  </div>
  <button class="btn btn-primary">Prompt!</button>
  {{ if or .FormSaved .FormError }}
  <div class="prompt-form-foot">
    {{ if .FormSaved }}<span class="status ok" role="alert">Prompt has been sent, thanks!</span>{{ end }}
    {{ with .FormError }}<span class="status err" role="alert">{{ . }}</span>{{ end }}
  </div>
  {{ end }}
</form>
