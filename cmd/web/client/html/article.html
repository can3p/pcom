{{ template "header.html" . }}

<main class="prose article">
  <h1>{{ .Name }}</h1>

  {{ markdown_article .Body }}
</main>

{{ if not .User.IsLoggedIn }}
<div class="article-cta">
  <a href="{{ link "signup" "attribution" .Attribution }}" class="btn btn-primary">Get Started</a>
</div>
{{ end }}

{{ template "footer.html" . }}
