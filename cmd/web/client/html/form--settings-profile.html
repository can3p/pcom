<form class="settings-form"
      method="POST"
      action="{{ link "form_save_profile" }}"
      hx-post="{{ link "form_save_profile" }}"
      hx-swap="outerHTML"
      hx-disabled-elt="this"
      >

  <div class="field"
       data-controller="mdeditor"
       data-mdeditor-upload-value="{{ link "action" "upload_media" }}"
    >
    <label for="profileAbout">About you</label>

    <div class="box settings-editor">
      {{ template "partial--editor-toolbar.html" toMap "UploadID" "profileFileUpload" }}
      <textarea name="about"
                id="profileAbout"
                rows="6"
                autocomplete="off"
                aria-describedby="profileAboutHelp{{ if (.Errors.HasError "about") }} profileAboutError{{ end }}"
                {{ if (.Errors.HasError "about") }}aria-invalid="true"{{ end }}
                >{{ if .Input }}{{ .Input.About }}{{ end }}</textarea>
    </div>
    {{ if (.Errors.HasError "about") }}
    <p class="field-error" id="profileAboutError">{{ .Errors.about }}</p>
    {{ end }}
    <p class="field-help" id="profileAboutHelp">Markdown. Up to {{ .AboutMaxLength }} characters; leave empty to hide the section.</p>
  </div>

  <div class="settings-row">
    <button type="submit" class="btn btn-primary">Save</button>
    {{ template "partial--settings_status.html" . }}
  </div>
</form>
