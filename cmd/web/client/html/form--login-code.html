<form method="POST"
      action="{{ link "form_login_code" }}"
      hx-post="{{ link "form_login_code" }}"
      hx-swap="outerHTML"
      hx-disabled-elt="this"
  >

  <input type="hidden" name="email" value="{{ .Input.Email }}" />
  <input type="hidden" name="return_url" value="{{ .Input.ReturnURL }}" />
  <input type="hidden" name="sign" value="{{ .Input.Sign }}" />

  <p class="auth-note">If <strong>{{ .Input.Email }}</strong> belongs to an account, we have mailed a login code to it.</p>

  <div class="field">
    <label for="loginCode">Code</label>
    <input name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
                       {{ if (.Errors.HasError "code") }}aria-invalid="true" aria-describedby="loginCodeError"{{ end }}
                       id="loginCode" required autofocus>
    {{ if (.Errors.HasError "code") }}
    <p class="field-error" id="loginCodeError" data-testid="field-error-code">{{ .Errors.code }}</p>
    {{ end }}
  </div>

  <div class="auth-submit">
    <button type="submit" class="btn btn-primary">Log in</button>
    {{ with .FormError }}<span class="status err" role="alert" data-testid="form-error">{{ . }}</span>{{ end }}
  </div>

  {{ if .Input.Sign }}
  <p class="field-help auth-links"><a href="{{ link "login" "return_url" .Input.ReturnURL "sign" .Input.Sign }}">Use a different email</a></p>
  {{ else }}
  <p class="field-help auth-links"><a href="{{ link "login" }}">Use a different email</a></p>
  {{ end }}
</form>
