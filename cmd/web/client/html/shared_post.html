{{ template "header.html" . }}

<main class="posts-page">
  <article class="post-view">
    <h1 class="post-title">{{ .PostSubject }}</h1>
    <p class="meta"><a href="{{ link "user" .Author.Username }}">{{ .Author.Username }}</a></p>

    <div class="prose prose-post">
      {{ markdown_single_post .Post.Body }}
    </div>
  </article>
</main>

{{ template "footer.html" . }}
