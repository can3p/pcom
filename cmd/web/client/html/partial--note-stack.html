{{/* Notes captured close together, under one heading that selects them all. Group: a web.NoteGroup,
     User: the viewer's auth.UserData. */}}
<section class="note-stack" aria-label="{{ .Group.Label }}">
  <header class="note-stack-head">
    <input type="checkbox" data-notes-target="stackPick" data-action="notes#selectStack" data-stack="{{ .Group.StackID }}" aria-label="Select {{ .Group.Label }}">
    <a href="{{ .Group.Href }}">{{ .Group.Label }}</a>
  </header>
  {{ range .Group.Items }}
  {{ template "partial--note-item.html" toMap "Item" . "User" $.User "Stack" $.Group.StackID }}
  {{ end }}
</section>
