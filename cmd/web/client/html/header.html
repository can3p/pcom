<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .ProjectName }} - {{ if .User }}{{ if .User.IsLoggedIn }}{{ .User.DBUser.Username }} - {{ end }}{{ end }}{{ .Name }}</title>
    <meta property="og:title" content="{{ .ProjectName }} - {{ .Name }}">
    <meta name="keywords" content="{{ .ProjectName }}">
    <meta name="description" content="Best private social network in the world">
    <meta property="og:description" content="Best private social network in the world">
    <meta property="og:site_name" content="Private communities">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="{{ static_asset "main.css" }}" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="{{ static_asset "fonts/golos-text-latin-400-normal.woff2" }}">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="{{ static_asset "fonts/golos-text-latin-800-normal.woff2" }}">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="{{ static_asset "fonts/golos-text-cyrillic-400-normal.woff2" }}">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="{{ static_asset "fonts/golos-text-cyrillic-800-normal.woff2" }}">
    {{ if .RSSFeed }}
    <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ .RSSFeed }}" />
    {{ end }}
    <link rel="apple-touch-icon" sizes="180x180" href="{{ static_asset "static/apple-touch-icon.png" }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ static_asset "static/favicon-32x32.png" }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ static_asset "static/favicon-16x16.png" }}">
    <link rel="manifest" href="/static/static/site.webmanifest">
  </head>
  <body hx-boost="true"{{ if .User }} hx-ext="head-support" hx-headers='{"X-CSRFToken": "{{ .User.CSRFToken }}"}'{{ end }}>
    <script nonce="{{ .ScriptNonce }}">
      // we really want to load inline styles for youtube embed
      window.liteYouTubeNonce = "{{ .StyleNonce }}"
      window.scriptNonce = "{{ .ScriptNonce }}"
      window.styleNonce = "{{ .StyleNonce }}"
    </script>
    <div class="page-container">
      <header class="nav-bar page-container-header">
        <nav class="nav" aria-label="Main">
          <a class="nav-brand" href="/">
            <img src="{{ static_asset "static/android-chrome-512x512.png" }}" alt="" width="32" height="32"><span>{{ .ProjectName }}</span>
          </a>
          <div class="nav-phone">
            {{ if .User.IsLoggedIn }}
            <a class="nav-icon nav-write" href="{{ link "write" }}" aria-label="Write a post"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></a>
            {{ end }}
            <button class="nav-icon" type="button" data-controller="toggle" data-toggle-target-value="#nav-menu" aria-controls="nav-menu" aria-expanded="false" aria-label="Toggle navigation"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg></button>
          </div>
          <div class="nav-menu" id="nav-menu">
            {{ template "header--links.html" toMap "User" .User "ProjectName" .ProjectName }}
          </div>
        </nav>
      </header>
      <div class="page-container-body d-flex flex-column mb-3">
