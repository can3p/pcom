<form
  method="POST"
  action="{{ link "form_signup_waiting_list" }}"
  hx-post="{{ link "form_signup_waiting_list" }}"
  hx-swap="outerHTML"
  hx-disabled-elt="this"
  >

  <input type="hidden" name="attribution" value="{{ if .Attribution }}{{ .Attribution }}{{ else if .Input }}{{ if .Input.Attribution }}{{ .Input.Attribution }}{{ end }}{{ end }}" />

  <div class="field">
    <label for="waitingListEmail">Email address</label>
    <input name="email" type="email"
                        value="{{ if .Input }}{{ .Input.Email }}{{ end }}"
                        {{ if (.Errors.HasError "email") }}aria-invalid="true" aria-describedby="waitingListEmailError"{{ end }}
                        id="waitingListEmail"
                        required>
    {{ if (.Errors.HasError "email") }}
    <p class="field-error" id="waitingListEmailError" data-testid="field-error-email">{{ .Errors.email }}</p>
    {{ end }}
  </div>
  <div class="field">
    <label for="waitingListReason">Any message to the service authors!</label>
    <textarea id="waitingListReason" name="reason" placeholder="">{{ if .Input }}{{ .Input.Reason }}{{ end }}</textarea>
  </div>

  <div class="auth-submit">
    <button type="submit" class="btn btn-primary">Join</button>
  </div>

  <p class="field-help auth-links">By signing up, you agree to our <a href="{{ link "terms_of_service" }}">terms of service</a> and <a href="{{ link "privacy_policy" }}">privacy policy.</a></p>
  <p class="field-help auth-links">Have account? <a href="{{ link "login" }}">Log in!</a></p>
</form>
