<p class="mail-lead">@{{.Username}} published a new post</p>

<div class="mail-quote">
<h1 class="mail-post-title"><a href="{{.Link}}">{{.Subject}}</a></h1>{{if .LinkedURL}}
<p class="mail-muted"><a href="{{.LinkedURL}}">{{.LinkedURL}}</a></p>{{end}}
{{.Body}}
</div>

<p><a class="mail-button" href="{{.Link}}">Read and comment</a></p>
