# Local development stack for pcom. Use the make targets rather than typing
# `docker compose` by hand: `make dev-up` / `make dev-down`, `make migrate`,
# `make psql`, `make tools-shell` and so on (see the Makefile).
#
# Published host ports (each overridable through the env var in brackets, so
# a second checkout can run next to this one with `docker compose -p <name>`):
#
#   host port  what answers                          in-network equivalent
#   ---------  ------------------------------------  ---------------------
#   5442       Postgres 16, db/user/password `pcom`  postgres:5432         [PCOM_PG_PORT]
#              (not 5432, so a native Postgres can't silently take the app's connections)
#   8811       tommy UI (/ui/) and API (/api/v1/)    tommy:8811            [PCOM_TOMMY_PORT]
#              captured mail: http://localhost:8811/ui/ or GET /api/v1/events?plugin=mail
#              Mailjet v3.1 send API is answered here too
#   8822       tommy fake vendor ingress             tommy:8822            [PCOM_TOMMY_INGRESS_PORT]
#   9555       tommy S3 (path-style, any creds),     tommy:9000            [PCOM_S3_PORT]
#              bucket `pcom-media`; objects: GET :8811/api/v1/s3/buckets/pcom-media/objects
#              (not 9000/9090/9091: MinIO, `make pprof_tunnel`, `make pprof_heap`)
#   8080       the app (profile `dev`, `make dev`)   app:8080              [PCOM_APP_PORT]
#
# No service sets container_name, so the project name (-p) keeps checkouts apart.
# Volumes: pgdata (database), tommydata (S3 buckets and objects; captured mail
# is not persisted), gomod and gobuild (Go caches of the tools and dev containers),
# webnodemodules (node_modules of the dev containers).
# `docker compose down -v` gives a clean slate.

services:
  postgres:
    # The same image as the test harness.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pcom
      POSTGRES_PASSWORD: pcom
      POSTGRES_DB: pcom
    ports:
      - "${PCOM_PG_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcom -d pcom"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Mail sink and object store in one container.
  tommy:
    image: can3p/tommy:0.3.0
    environment:
      TOMMY_S3_BUCKETS: pcom-media
      TOMMY_PERSIST: /data/tommy
    ports:
      - "${PCOM_TOMMY_PORT:-8811}:8811"
      - "${PCOM_TOMMY_INGRESS_PORT:-8822}:8822"
      - "${PCOM_S3_PORT:-9555}:9000"
    volumes:
      - tommydata:/data

  # Dev tooling: sql-migrate, sqlboiler, psql, go run. Run through make
  # (`make tools-shell`, `make migrate`, ...), which sets HOST_UID/HOST_GID so
  # the files it writes belong to you.
  tools:
    build:
      context: .
      dockerfile: tools/Dockerfile
      target: tools
    profiles: ["tools"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /src
    environment:
      DATABASE_URL: postgres://pcom:pcom@postgres:5432/pcom?sslmode=disable
    volumes:
      - .:/src
      - gomod:/cache/gomod
      - gobuild:/cache/gobuild
    extra_hosts:
      # `make migrate-prod` reaches the `make tunnel` fly proxy on the host.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # Container mode (`make dev`, profile `dev`): the app with live reload and
  # the frontend watcher, both from tools/Dockerfile target `dev`. Host mode
  # (`make dev-up`, then `cd cmd/web && make watchexec` and `yarn watch`) keeps
  # working against the published ports. The services set the in-network
  # values as real environment variables; godotenv never overrides them, so
  # cmd/web/.env (host-mode values) can stay in place. Mail and object storage
  # are left at the app's defaults (not tommy yet).
  #
  # File watching: watchexec uses inotify. On macOS, Docker Desktop's file
  # sharing (VirtioFS) forwards change events for bind mounts, so edits made on
  # the host restart the app. If they don't (older Docker Desktop, or gRPC FUSE
  # file sharing), run `PCOM_WATCH_POLL=1000 make dev` to poll every second
  # instead, or run the app in host mode.
  app:
    build: &dev-build
      context: .
      dockerfile: tools/Dockerfile
      target: dev
    profiles: ["dev"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /src/cmd/web
    # PCOM_WATCH_POLL=<ms> switches watchexec to polling (see above).
    command:
      - sh
      - -c
      - exec watchexec $${PCOM_WATCH_POLL:+--poll $${PCOM_WATCH_POLL}ms} -w /src --exts go,html,md --ignore '**/node_modules/**' --restart -- go run .
    environment:
      DATABASE_URL: postgres://pcom:pcom@postgres:5432/pcom?sslmode=disable
      SESSION_SALT: local-dev-session-salt-change-me
      SITE_ROOT: http://localhost:8080
      PORT: "8080"
      PCOM_WATCH_POLL: ${PCOM_WATCH_POLL:-}
    ports:
      - "${PCOM_APP_PORT:-8080}:8080"
    volumes:
      - .:/src
      - webnodemodules:/src/cmd/web/node_modules
      - gomod:/cache/gomod
      - gobuild:/cache/gobuild
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend bundle watcher; writes cmd/web/dist on the bind mount, which host
  # mode reads too.
  assets:
    build: *dev-build
    profiles: ["dev"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /src/cmd/web
    command: ["sh", "-c", "yarn install --frozen-lockfile && yarn watch"]
    volumes:
      - .:/src
      - webnodemodules:/src/cmd/web/node_modules

volumes:
  pgdata:
  tommydata:
  gomod:
  gobuild:
  webnodemodules:
