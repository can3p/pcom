# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/cmd/web"
    schedule:
      interval: "daily"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # The website is its own module.
  - package-ecosystem: "gomod"
    directory: "/website"
    schedule:
      interval: "daily"
    groups:
      website-go-dependencies:
        patterns:
          - "*"

  # Go toolchain: the golang:<minor>-alpine base images. The `go` directive in
  # go.mod is not touched by dependabot; bump it by hand with the images.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/tools"
    schedule:
      interval: "daily"
    groups:
      docker-images:
        patterns:
          - "*"
