name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

env:
  GOLANGCI_LINT_VERSION: "v2.10.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Run tests
        run: make cover

      - name: Check coverage floors
        run: make cover-check

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
        if: always()
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Build Go
        run: make check

  gofix:
    name: Go Fix
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Run go fix
        run: make fix

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: apply go fix"
          file_pattern: "*.go"

  browser:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: cmd/web/yarn.lock

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
        working-directory: cmd/web

      - name: Cache Playwright driver and Chromium
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-go
          key: playwright-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Install Chromium
        run: make ui-deps UI_DEPS_FLAGS=--with-deps

      - name: Browser tests
        run: make test-ui
        env:
          QRUN_MAX: "400"

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-artifacts
          path: .ui-artifacts/
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: cmd/web/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: cmd/web

      - name: Build frontend
        run: yarn build
        working-directory: cmd/web

  models:
    name: Generated models are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build tools image
        run: docker compose --profile tools build tools

      - name: Start Postgres
        run: docker compose up -d --wait postgres

      - name: Generate models
        run: make generate

      - name: Check for a diff
        run: git diff --exit-code -- pkg/model

  dev-image:
    name: Dev image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build dev image
        run: docker build --target dev -f tools/Dockerfile .

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: website/go.mod
          cache: true
          cache-dependency-path: website/go.sum

      - name: Vet
        working-directory: website
        run: go vet ./...

      - name: Test
        working-directory: website
        run: go test ./...

      - name: Build site
        working-directory: website
        run: go run . -out ../site
